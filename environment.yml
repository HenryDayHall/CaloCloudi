# ---------------------------------------------------------------------------
# Conda environment for a k-diffusion / PyTorch project on CUDA 12.6.
#
#   conda env create -f environment.yml
#   conda activate kdiff
#   python check_env.py
#
# Design note: conda only provides the Python interpreter and pip. Everything
# else comes from pip via requirements.txt. This is deliberate — PyTorch
# stopped publishing conda packages after 2.5.1, so the `pytorch` /
# `nvidia` conda channels can no longer give you a CUDA 12.6 build. Mixing
# conda-forge numpy/scipy with pip-installed torch is also a classic source of
# ABI breakage, so we keep a single package manager below the interpreter.
#
# You do NOT need a system CUDA toolkit: the cu126 wheels bundle the CUDA
# runtime, cuDNN, cuBLAS, NCCL, etc. You only need an NVIDIA driver new enough
# for CUDA 12.x (>= 525.60.13 on Linux, >= 528.33 on Windows). Check with
# `nvidia-smi`.
# ---------------------------------------------------------------------------
name: caloi

channels:
  - conda-forge
  - nodefaults

dependencies:
  # 3.11 is the sweet spot here: supported by every wheel below, and old
  # enough that anything you pip-install later will have a binary build.
  - python=3.11
  - pip>=24.0

  # Handy to have on PATH for poking at .h5 files (h5ls, h5dump). The h5py
  # wheel bundles its own libhdf5, so this is a convenience, not a dependency.
  - hdf5

  # Needed by `pip install git+https://...` if you switch k-diffusion to a
  # source install (see requirements.txt).
  - git

  # Uncomment ONLY if you need to compile CUDA extensions yourself (nvcc) —
  # e.g. NATTEN, flash-attn, or custom kernels. Match the wheel's CUDA
  # version to avoid subtle mismatches.
  # - cuda-toolkit=12.6   # from the nvidia channel; add `- nvidia` to channels

  - pip:
      - -r requirements.txt
